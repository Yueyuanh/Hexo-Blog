preconnect:
  - https://gcore.jsdelivr.net
  - https://unpkg.com
  - https://cdn.bootcdn.net

inject:
  head:
    - <link rel="apple-touch-icon" sizes="180x180" href="/assets/logo/my_logo.png">
    - <link rel="icon" type="image/png" sizes="32x32" href="/assets/logo/my_logo.png">
    - <link rel="icon" type="image/png" sizes="16x16" href="/assets/logo/my_logo.png">
    - <link rel="manifest" href="/assets/xaoxuu/favicon/site.webmanifest">
    - <link rel="shortcut icon" href="/assets/logo/my_logo.ico">
    - <meta name="theme-color" content="#f8f8f8">
    - <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/lxgw-wenkai-screen-webfont/1.7.0/style.min.css" media="all" />
    - |
      <style id="hexo-desktop-sidebar">
      @media screen and (min-width: 1180px) {
        .l_body .l_left {
          width: 100%;
          justify-self: stretch;
          margin-left: 0;
          margin-right: 0;
          border-radius: 0 16px 16px 0;
        }
        .l_body .l_left > .leftbar-container {
          width: var(--width-sidebar);
          margin-left: auto;
        }
      }
      .hexo-publish-action {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-left: 8px;
        padding: 6px 10px;
        border: 1px solid var(--block-border);
        border-radius: 8px;
        color: var(--text-p1);
        background: var(--block);
        cursor: pointer;
        font: inherit;
      }
      .hexo-publish-action:hover {
        color: var(--color-hover, var(--text-p1));
        border-color: currentColor;
      }
      </style>
    - |
      <script>
      (() => {
        const installHexoPreviewControls = () => {
          if (window.parent === window) return;
          const nav = document.querySelector('.navbar.top nav');
          if (!nav || nav.querySelector('.hexo-publish-action')) return;
          const publish = document.createElement('a');
          publish.href = '#';
          publish.className = 'hexo-publish-action';
          publish.textContent = 'Publish';
          publish.title = '发布到 Git 远程仓库';
          publish.addEventListener('click', (event) => {
            event.preventDefault();
            window.parent.postMessage({ type: 'hexo-manager-publish' }, '*');
          });
          nav.appendChild(publish);
        };
        const installScrollBridge = () => {
          window.addEventListener('message', (event) => {
            if (event.source !== window.parent || event.data?.type !== 'hexo-manager-scroll') return;
            const ratio = Math.min(1, Math.max(0, Number(event.data.ratio) || 0));
            const root = document.scrollingElement || document.documentElement;
            root.scrollTop = ratio * Math.max(0, root.scrollHeight - window.innerHeight);
          });
        };
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', installHexoPreviewControls, { once: true });
        } else {
          installHexoPreviewControls();
        }
        installScrollBridge();
      })();
      </script>

topic:
  enable: true
  filter: "topics"  

# 直接加载图片，避免快速滚动时懒加载观察器或外部 CDN 未及时响应导致图片停留在占位图。
plugins:
  lazyload:
    enable: false

# 强制实用日期
force_date: true
# favicon: /assets/logo/my_logo.ico

logo:
  icon: /assets/icon.svg
  title: 沉潜的小屋
  subtitle: '欢迎来到远浩妙妙屋 | Designed by YueYuanhaoo'

# 导航栏
menubar:
  items: 
    - id: post
      theme: '#1BCDFC'
      icon: solar:documents-bold-duotone
      title: 博客
      url: /

    - id: topic
      theme: '#3DC550'
      icon: solar:notebook-bookmark-bold-duotone
      title: 专栏
      url: /topic/

    - id: explore
      theme: '#FA6400'
      icon: solar:planet-bold-duotone
      title: 探索
      url: https://yueyuanhaoo.netlify.app/
      # url: /explore/

    - id: social
      theme: '#F44336'
      icon: solar:chat-square-like-bold-duotone
      title: 社交
      url: /
      # url: /friends/

site_tree:
  home:
    sidebar: starter, welcome, recent
    rightbar: tagcloud, topic
  index_blog:
    sidebar: starter, welcome, recent
    rightbar: tagcloud, topic
  index_topic:
    menu_id: topic
  topic:
    menu_id: topic

